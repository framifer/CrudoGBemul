<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<title>CrudoGB's Emul - GB / GBC / GBA</title>
<style>
* { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
:root { --gb-body: #c4cfa1; }
html, body { height: 100%; width: 100%; overscroll-behavior: none; }
body { background-color:#111; margin:0; padding:0; display:flex; justify-content:center; align-items:center; min-height:100vh; font-family:'Courier New', monospace; overflow:hidden; touch-action:none; }

#phone-screen { width:100vw; max-width:420px; height:100vh; max-height:900px; background-color:var(--gb-body); display:flex; flex-direction:column; border:2px solid #2a2a2a; border-radius:26px 26px 44px 44px; box-shadow:0 0 30px rgba(0,0,0,0.9), inset 0 0 8px rgba(255,255,255,0.15); overflow:hidden; position:relative; transition:background-color 0.25s ease; }

#screen-container { flex:0 0 46%; background-color:#222; display:flex; justify-content:center; align-items:center; padding:12px; position:relative; }
#game-wrapper { position:relative; width:320px; height:320px; max-width:100%; aspect-ratio:1/1; margin:0 auto; border:4px solid #111; border-radius:8px; background-color:#000; box-shadow:inset 0 0 12px rgba(0,0,0,0.7); overflow:hidden; }
#game { width:100%; height:100%; }
#game canvas, canvas { display:block !important; width:100% !important; height:100% !important; image-rendering:pixelated; border-radius:4px; background:#000; }

#loader { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:10px; background:#0d1a0d; color:#c4cfa1; text-align:center; padding:14px; z-index:20; }
#loader h1 { margin:0; font-size:17px; letter-spacing:1px; color:#8bac0f; }
#loader p { margin:0; font-size:11px; line-height:1.45; color:#9bbc0f; max-width:275px; }
.load-btn { background:linear-gradient(145deg,#8bac0f,#306230); color:#0f380f; font-weight:bold; font-family:inherit; font-size:13px; padding:12px 18px; border:none; border-radius:8px; box-shadow:inset 1px 1px 2px rgba(255,255,255,0.3), 0 3px 6px rgba(0,0,0,0.5); cursor:pointer; }
.load-btn:active { transform:translateY(2px); }
#rom-input { display:none; }
#status { font-size:10px; color:#8bac0f; min-height:14px; font-weight:bold; }
#sab-warn { font-size:9px; color:#f2c11e; max-width:280px; line-height:1.35; }

#toast { position:absolute; top:26px; left:50%; transform:translateX(-50%); background:rgba(15,56,15,0.95); color:#e8f0d0; border:1px solid #8bac0f; padding:5px 12px; border-radius:12px; font-size:10px; font-weight:bold; z-index:35; opacity:0; pointer-events:none; transition:opacity 0.2s ease; }
#toast.show { opacity:1; }

#controller { flex:1; background-color:var(--gb-body); display:flex; flex-direction:column; justify-content:space-between; padding:18px 18px 34px; border-top:4px solid #555; transition:background-color 0.25s ease; touch-action:none; }

#sysbar { display:flex; justify-content:space-between; align-items:center; width:100%; margin-bottom:12px; gap:10px; }
.sys-btn { background:#3a3a3a; color:#c4cfa1; font-family:inherit; font-size:11px; font-weight:bold; letter-spacing:1.5px; border:none; border-radius:8px; padding:10px 18px; box-shadow:inset 1px 1px 2px rgba(255,255,255,0.15), 0 3px 5px rgba(0,0,0,0.5); cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
.sys-btn:active { transform:translateY(1px); background:#222; }
.sys-btn:disabled { opacity:0.4; }

.shoulder-btn { width:86px; height:38px; background:linear-gradient(145deg, #525252, #262626); color:#e8f0d0; font-family:inherit; font-size:16px; font-weight:bold; letter-spacing:1px; border:2px solid #1a1a1a; cursor:pointer; box-shadow:inset 1px 1px 2px rgba(255,255,255,0.22), 0 4px 6px rgba(0,0,0,0.55); touch-action:none; -webkit-tap-highlight-color:transparent; transition:transform 0.04s ease, background 0.04s ease; }
#btn-l { border-radius:16px 8px 14px 8px; }
#btn-r { border-radius:8px 16px 8px 14px; }
.shoulder-btn:active, .shoulder-btn.active { transform:translateY(2px); background:linear-gradient(145deg, #2b2b2b, #151515); color:#8bac0f; box-shadow:inset 2px 2px 5px rgba(0,0,0,0.85); }

.controls-top { display:flex; justify-content:space-between; align-items:flex-start; width:100%; padding:0 4px; touch-action:none; }

.dpad { position:relative; width:190px; height:190px; flex-shrink:0; border-radius:50%; background:radial-gradient(circle at 42% 38%, #2c2c2c, #0c0c0c 78%); box-shadow:0 6px 10px rgba(0,0,0,0.5), inset 2px 2px 4px rgba(255,255,255,0.08), inset -3px -3px 8px rgba(0,0,0,0.9); touch-action:none; -webkit-tap-highlight-color:transparent; cursor:pointer; }
.dpad::before, .dpad::after { content:""; position:absolute; background:linear-gradient(145deg, #3a3a3a, #161616); box-shadow:inset 1px 1px 2px rgba(255,255,255,0.15), inset -1px -1px 3px rgba(0,0,0,0.8); border-radius:11px; pointer-events:none; }
.dpad::before { top:26px; bottom:26px; left:50%; width:52px; transform:translateX(-50%); }
.dpad::after { left:26px; right:26px; top:50%; height:52px; transform:translateY(-50%); }
.dpad.active { box-shadow:0 4px 6px rgba(0,0,0,0.5), inset 3px 3px 6px rgba(0,0,0,0.9); }

.dpad-glow { position:absolute; width:66px; height:66px; left:50%; top:50%; margin-left:-33px; margin-top:-33px; border-radius:50%; background:radial-gradient(circle, rgba(120,205,255,0.55) 0%, rgba(90,150,220,0.28) 45%, rgba(0,0,0,0) 72%); box-shadow:0 0 14px rgba(120,205,255,0.5), inset 0 0 8px rgba(0,0,0,0.6); pointer-events:none; opacity:0; transition:opacity 0.08s ease, transform 0.05s ease; z-index:5; }
.dpad.active .dpad-glow { opacity:1; }

.dpad-arm, .dpad-center { display:none; pointer-events:none; }

.dpad.cross-mode { background: transparent !important; box-shadow: none !important; border-radius: 0; filter: drop-shadow(0 5px 7px rgba(0,0,0,0.55)); }
.dpad.cross-mode::before, .dpad.cross-mode::after, .dpad.cross-mode .dpad-glow { display: none !important; }
.dpad.cross-mode .dpad-arm { display: flex; justify-content: center; align-items: center; position: absolute; background: linear-gradient(145deg, #383838, #1c1c1c); color: #777; font-size: 20px; font-weight: bold; border: 2px solid #111; box-shadow: inset 1px 1px 2px rgba(255,255,255,0.18), inset -1px -1px 3px rgba(0,0,0,0.8); transition: background 0.04s ease, color 0.04s ease, transform 0.04s ease, box-shadow 0.04s ease; z-index: 2; }
.dpad.cross-mode .arm-up { top: 12px; left: 50%; width: 56px; height: 64px; transform: translateX(-50%); border-radius: 10px 10px 0 0; border-bottom: none; }
.dpad.cross-mode .arm-down { bottom: 12px; left: 50%; width: 56px; height: 64px; transform: translateX(-50%); border-radius: 0 0 10px 10px; border-top: none; }
.dpad.cross-mode .arm-left { left: 12px; top: 50%; width: 64px; height: 56px; transform: translateY(-50%); border-radius: 10px 0 0 10px; border-right: none; }
.dpad.cross-mode .arm-right { right: 12px; top: 50%; width: 64px; height: 56px; transform: translateY(-50%); border-radius: 0 10px 10px 0; border-left: none; }
.dpad.cross-mode .dpad-center { display: block; position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; transform: translate(-50%, -50%); background: #242424; z-index: 3; }
.dpad.cross-mode .dpad-center::after { content: ""; position: absolute; inset: 11px; border-radius: 50%; background: radial-gradient(circle at 60% 60%, #2e2e2e, #141414); box-shadow: inset 2px 2px 4px rgba(0,0,0,0.85), inset -1px -1px 2px rgba(255,255,255,0.1); }

.dpad.cross-mode.dir-up .arm-up { background: linear-gradient(145deg, #1b381b, #0f240f); color: #9bbc0f; text-shadow: 0 0 8px #8bac0f; box-shadow: inset 0 4px 8px rgba(0,0,0,0.9), 0 0 10px rgba(139,172,15,0.45); transform: translateX(-50%) translateY(2px); }
.dpad.cross-mode.dir-down .arm-down { background: linear-gradient(145deg, #1b381b, #0f240f); color: #9bbc0f; text-shadow: 0 0 8px #8bac0f; box-shadow: inset 0 -4px 8px rgba(0,0,0,0.9), 0 0 10px rgba(139,172,15,0.45); transform: translateX(-50%) translateY(-2px); }
.dpad.cross-mode.dir-left .arm-left { background: linear-gradient(145deg, #1b381b, #0f240f); color: #9bbc0f; text-shadow: 0 0 8px #8bac0f; box-shadow: inset 4px 0 8px rgba(0,0,0,0.9), 0 0 10px rgba(139,172,15,0.45); transform: translateY(-50%) translateX(2px); }
.dpad.cross-mode.dir-right .arm-right { background: linear-gradient(145deg, #1b381b, #0f240f); color: #9bbc0f; text-shadow: 0 0 8px #8bac0f; box-shadow: inset -4px 0 8px rgba(0,0,0,0.9), 0 0 10px rgba(139,172,15,0.45); transform: translateY(-50%) translateX(-2px); }

.action-buttons { position:relative; width:150px; height:200px; flex-shrink:0; margin-right:60px; filter:drop-shadow(3px 6px 5px rgba(0,0,0,0.3)); touch-action:none; }
.btn-round-container { position:absolute; text-align:center; }
.btn-b-container { left:4px; top:120px; }
.btn-a-container { left:64px; top:40px; }

.btn-round { width:74px; height:74px; background:linear-gradient(145deg, #a72352, #6e1333); border-radius:50%; border:none; color:white; font-weight:bold; font-size:25px; cursor:pointer; box-shadow:inset 1px 2px 3px rgba(255,255,255,0.3), inset -2px -2px 5px rgba(0,0,0,0.6); transition:transform 0.04s ease; touch-action:none; -webkit-tap-highlight-color:transparent; }
.btn-round:active, .btn-round.active { transform:translate(2px,3px); box-shadow:inset 2px 2px 7px rgba(0,0,0,0.8); background:#5b0f2a; }

.controls-bottom { display:flex; justify-content:center; gap:45px; margin-top:0; margin-bottom:20px; touch-action:none; }
.btn-pill-container { text-align:center; transform:rotate(-25deg); filter:drop-shadow(2px 4px 3px rgba(0,0,0,0.3)); }
.btn-pill { width:88px; height:23px; background:linear-gradient(145deg, #6e6e6e, #333); border-radius:12px; border:none; cursor:pointer; box-shadow:inset 1px 1px 2px rgba(255,255,255,0.2), inset -1px -1px 3px rgba(0,0,0,0.7); touch-action:none; -webkit-tap-highlight-color:transparent; }
.btn-pill:active, .btn-pill.active { transform:translate(1px,2px); background:#222; box-shadow:inset 1px 1px 4px rgba(0,0,0,0.9); }
.btn-pill-label { font-size:12px; color:#306230; text-align:center; margin-top:6px; font-weight:bold; letter-spacing:1px; pointer-events:none; }

#menu-modal { position:absolute; inset:0; background:rgba(0,0,0,0.78); z-index:40; display:none; justify-content:center; align-items:center; }
#menu-modal.open { display:flex; }
.menu-panel { background:#1a1f18; border:2px solid #8bac0f; border-radius:12px; width:88%; max-width:340px; max-height:88%; overflow-y:auto; padding:18px; color:#c4cfa1; box-shadow:0 8px 30px rgba(0,0,0,0.7); touch-action:pan-y; }
.menu-panel h2 { margin:0 0 12px; font-size:16px; color:#8bac0f; text-align:center; letter-spacing:1px; }
.menu-row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 6px; border-bottom:1px solid #2a3324; }
.menu-row:last-child { border-bottom:none; }
.menu-row span { font-size:11px; font-weight:bold; }
.menu-act { background:#306230; color:#e8f0d0; border:none; border-radius:6px; font-family:inherit; font-size:11px; font-weight:bold; padding:8px 12px; cursor:pointer; white-space:nowrap; }
.menu-act:active { transform:translateY(1px); }
.menu-act:disabled { opacity:0.4; cursor:not-allowed; transform:none; }
.menu-close { display:block; width:100%; margin-top:14px; background:#5b1030; color:#fff; border:none; border-radius:8px; font-family:inherit; font-size:12px; font-weight:bold; padding:11px; cursor:pointer; }

#color-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; justify-items:center; padding:12px 4px 6px; }
.swatch-item { display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; }
.swatch { width:38px; height:38px; border-radius:50%; border:2px solid rgba(255,255,255,0.35); box-shadow:inset 1px 1px 2px rgba(255,255,255,0.4), 0 2px 4px rgba(0,0,0,0.5); transition:transform 0.08s ease; }
.swatch-item:active .swatch { transform:scale(0.9); }
.swatch.selected { border-color:#fff; box-shadow:0 0 0 3px #8bac0f, inset 1px 1px 2px rgba(255,255,255,0.4); }
.swatch-label { font-size:9px; color:#c4cfa1; text-align:center; font-weight:bold; }
.submenu { display:none; }
.submenu.open { display:block; }

@media (orientation: landscape) {
  #phone-screen { max-width: 100vw; max-height: 100vh; width: 100vw; height: 100vh; border-radius: 18px; flex-direction: row; justify-content: center; align-items: center; }
  #screen-container { flex: 0 0 auto; height: 100%; padding: 44px 10px 10px; background-color: transparent; z-index: 5; }
  #game-wrapper { height: min(78vh, 340px); width: auto; aspect-ratio: 3 / 2; }
  #controller { display: contents; }
  #sysbar { position: absolute; top: 8px; left: max(14px, env(safe-area-inset-left)); right: max(14px, env(safe-area-inset-right)); width: auto; margin: 0; z-index: 25; pointer-events: none; }
  #sysbar button { pointer-events: auto; }
  .shoulder-btn { width: 96px; height: 36px; }
  
  .controls-top { position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: center; padding: 36px max(18px, env(safe-area-inset-right)) 20px max(18px, env(safe-area-inset-left)); pointer-events: none; z-index: 10; }
  .dpad { pointer-events: auto; width: 150px; height: 150px; }
  .dpad::before { top: 20px; bottom: 20px; width: 42px; }
  .dpad::after  { left: 20px; right: 20px; height: 42px; }

  .dpad.cross-mode .arm-up, .dpad.cross-mode .arm-down { width: 46px; height: 50px; }
  .dpad.cross-mode .arm-left, .dpad.cross-mode .arm-right { width: 50px; height: 46px; }
  .dpad.cross-mode .dpad-center { width: 46px; height: 46px; }
  .dpad.cross-mode .arm-up { top: 8px; }
  .dpad.cross-mode .arm-down { bottom: 8px; }
  .dpad.cross-mode .arm-left { left: 8px; }
  .dpad.cross-mode .arm-right { right: 8px; }

  .action-buttons { pointer-events: auto; width: 146px; height: 160px; margin-right: 0; }
  .btn-b-container { left: 4px; top: 86px; }
  .btn-a-container { left: 74px; top: 18px; }
  .btn-round { width: 66px; height: 66px; font-size: 22px; }

  .controls-bottom { position: absolute; left: max(24px, env(safe-area-inset-left)); right: max(24px, env(safe-area-inset-right)); bottom: 10px; margin: 0; justify-content: space-between; pointer-events: none; z-index: 15; }
  .btn-pill-container { pointer-events: auto; transform: rotate(-18deg); }
  .btn-pill { width: 70px; height: 20px; }
  .btn-pill-label { font-size: 10px; margin-top: 4px; }
}

@media (orientation: portrait) and (max-height: 740px) {
  #screen-container { flex: 0 0 42%; padding: 8px; }
  #controller { padding: 10px 14px 18px; }
  .dpad { width: 160px; height: 160px; }
  .dpad::before { top: 22px; bottom: 22px; width: 44px; }
  .dpad::after { left: 22px; right: 22px; height: 44px; }
  .dpad.cross-mode .arm-up, .dpad.cross-mode .arm-down { width: 48px; height: 52px; }
  .dpad.cross-mode .arm-left, .dpad.cross-mode .arm-right { width: 52px; height: 48px; }
  .dpad.cross-mode .dpad-center { width: 48px; height: 48px; }
  .action-buttons { height: 170px; margin-right: 30px; }
  .btn-b-container { left: 4px; top: 96px; }
  .btn-a-container { left: 60px; top: 28px; }
  .btn-round { width: 66px; height: 66px; font-size: 22px; }
  .controls-bottom { margin-bottom: 10px; }
}
</style>
</head>
<body>
<div id="phone-screen">
  <div id="screen-container">
    <div id="game-wrapper">
      <div id="topbar"><span id="tb-name">—</span><span class="plat" id="tb-plat"></span></div>
      <div id="toast"></div>
      <div id="game"></div>
      <div id="loader">
        <h1>CrudoGB's Emul</h1>
        <p>Carica un file ROM (.gb / .gbc / .gba / .rom / .zip) per iniziare a giocare offline.</p>
        <button class="load-btn" id="pick-rom" type="button">CARICA ROM</button>
        <input type="file" id="rom-input" accept=".gb,.gbc,.gba,.rom,.bin,.zip,application/octet-stream">
        <div id="status"></div>
        <div id="sab-warn"></div>
      </div>
    </div>
  </div>

  <div id="controller">
    <div id="sysbar">
      <button class="shoulder-btn" id="btn-l" type="button">L</button>
      <button class="sys-btn" id="btn-menu" type="button">MENU</button>
      <button class="shoulder-btn" id="btn-r" type="button">R</button>
    </div>

    <div class="controls-top">
      <div class="dpad" id="dpad">
        <div class="dpad-glow" id="dpad-glow"></div>
        <div class="dpad-arm arm-up">▲</div>
        <div class="dpad-arm arm-down">▼</div>
        <div class="dpad-arm arm-left">◀</div>
        <div class="dpad-arm arm-right">▶</div>
        <div class="dpad-center"></div>
      </div>

      <div class="action-buttons" id="ab-zone">
        <div class="btn-round-container btn-b-container"><button class="btn-round" id="btn-b" type="button">B</button></div>
        <div class="btn-round-container btn-a-container"><button class="btn-round" id="btn-a" type="button">A</button></div>
      </div>
    </div>

    <div class="controls-bottom">
      <div class="btn-pill-container"><button class="btn-pill" id="btn-select" type="button"></button><div class="btn-pill-label">SELECT</div></div>
      <div class="btn-pill-container"><button class="btn-pill" id="btn-start" type="button"></button><div class="btn-pill-label">START</div></div>
    </div>
  </div>

  <!-- MODALE MENU -->
  <div id="menu-modal">
    <div class="menu-panel">
      <h2>MENU</h2>
      <div id="menu-main">
        <div class="menu-row"><span>Salva partita</span><button class="menu-act" id="btn-save" type="button" disabled>SALVA</button></div>
        <div class="menu-row"><span>Carica partita</span><button class="menu-act" id="btn-load" type="button" disabled>CARICA</button></div>
        <div class="menu-row"><span>Stile D-Pad</span><button class="menu-act" id="btn-dpad-style" type="button">TONDO</button></div>
        <div class="menu-row"><span>Cambia colore scocca</span><button class="menu-act" id="open-color" type="button">COLORE ▸</button></div>
        <div class="menu-row"><span>Schermo intero</span><button class="menu-act" id="btn-full" type="button" disabled>FULLSCREEN</button></div>
        <button class="menu-close" id="close-menu" type="button">CHIUDI</button>
      </div>
      <!-- Sottomenu 8 Colori Classici -->
      <div id="menu-color" class="submenu">
        <div class="menu-row"><span>8 Colori Classici</span><button class="menu-act" id="back-color" type="button">◂ INDIETRO</button></div>
        <div id="color-grid"></div>
        <button class="menu-close" id="close-menu2" type="button">CHIUDI</button>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";

const EJS_CDN = "https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@latest/data/";

/* ============ REGISTRAZIONE SERVICE WORKER STANDARD ============ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js').then(function(reg) {
      if (!window.crossOriginIsolated && navigator.serviceWorker.controller) {
        window.location.reload();
      }
    }).catch(function(err) {
      console.log('SW registration failed: ', err);
    });
  });
}

function haptic(ms){
  try { if (navigator.vibrate) navigator.vibrate(ms || 14); } catch(e){}
}

const toastEl = document.getElementById("toast");
let toastTimer = null;
function showToast(msg){
  if(!toastEl) return;
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove("show"), 1800);
}

const romInput=document.getElementById("rom-input"), pickBtn=document.getElementById("pick-rom"),
  loader=document.getElementById("loader"), statusEl=document.getElementById("status"),
  sabWarn=document.getElementById("sab-warn"), tbName=document.getElementById("tb-name"),
  tbPlat=document.getElementById("tb-plat"), btnMenu=document.getElementById("btn-menu"),
  btnSave=document.getElementById("btn-save"), btnLoad=document.getElementById("btn-load"),
  btnFull=document.getElementById("btn-full"), btnDpadStyle=document.getElementById("btn-dpad-style"),
  dpadEl=document.getElementById("dpad"), colorGrid=document.getElementById("color-grid"),
  menuModal=document.getElementById("menu-modal");

/* ============ 1) STILE D-PAD (TONDO vs CROCE "+") ============ */
const DPAD_KEY = "crudogb_dpad_style";
function applyDpadStyle(style){
  const isCross = (style === "cross");
  dpadEl.classList.toggle("cross-mode", isCross);
  btnDpadStyle.textContent = isCross ? "CROCE +" : "TONDO";
  try { localStorage.setItem(DPAD_KEY, isCross ? "cross" : "round"); } catch(e){}
}
btnDpadStyle.addEventListener("click", function(){
  haptic(12);
  const next = dpadEl.classList.contains("cross-mode") ? "round" : "cross";
  applyDpadStyle(next);
});
(function initDpadStyle(){
  let saved = "round";
  try { saved = localStorage.getItem(DPAD_KEY) || "round"; } catch(e){}
  applyDpadStyle(saved);
})();

/* ============ 2) MENU + 8 COLORI CLASSICI PRESTABILITI ============ */
const menuMain=document.getElementById("menu-main"), menuColor=document.getElementById("menu-color");
function openMenu(){

/* ============ 4) DATABASE LOCALE SALVATAGGI (IndexedDB) ============ */
const DB_NAME = "CrudoGB_SaveDB";
const DB_VERSION = 1;
let saveDbPromise = null;

function openSaveDB(){
  if(saveDbPromise) return saveDbPromise;
  saveDbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = function(e){
      const db = e.target.result;
      if(!db.objectStoreNames.contains("states")) db.createObjectStore("states");
      if(!db.objectStoreNames.contains("sram"))   db.createObjectStore("sram");
    };
    req.onsuccess = function(e){ resolve(e.target.result); };
    req.onerror   = function(e){ reject(e.target.error); };
  });
  return saveDbPromise;
}

async function dbPut(storeName, key, uint8Data){
  const db = await openSaveDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, "readwrite");
    tx.objectStore(storeName).put(new Uint8Array(uint8Data), key);
    tx.oncomplete = () => resolve(true);
    tx.onerror    = (e) => reject(e.target.error);
  });
}

async function dbGet(storeName, key){
  const db = await openSaveDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, "readonly");
    const req = tx.objectStore(storeName).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror   = (e) => reject(e.target.error);
  });
}

/* ============ 3) DETECT .ROM / .GB / .GBC / .GBA ============ */
async function detectCoreAndPlatform(file){
  const n = file.name.toLowerCase();
  if(n.endsWith(".gba")) return { core:"gba", label:"GAME BOY ADVANCE", ext:".gba" };
  if(n.endsWith(".gbc")) return { core:"gb",  label:"GAME BOY COLOR",   ext:".gbc" };
  if(n.endsWith(".gb"))  return { core:"gb",  label:"GAME BOY",         ext:".gb"  };

  try {
    const slice = await file.slice(0, 512).arrayBuffer();
    const b = new Uint8Array(slice);
    const gbLogo = [0xCE, 0xED, 0x66, 0x66, 0xCC, 0x0D, 0x00, 0x0B];
    let isGB = b.length >= 0x150;
    for(let i=0; i<gbLogo.length && isGB; i++){
      if(b[0x104 + i] !== gbLogo[i]) isGB = false;
    }
    if(isGB){
      const cgbFlag = b[0x143];
      if(cgbFlag === 0x80 || cgbFlag === 0xC0){
        return { core:"gb", label:"GAME BOY COLOR", ext:".gbc" };
      }
      return { core:"gb", label:"GAME BOY", ext:".gb" };
    }

    const gbaLogo = [0x24, 0xFF, 0xAE, 0x51, 0x69, 0x9A, 0xA2, 0x21];
    let isGBA = b.length >= 0xC0;
    for(let i=0; i<gbaLogo.length && isGBA; i++){
      if(b[0x04 + i] !== gbaLogo[i]) isGBA = false;
    }
    if(isGBA || (b.length >= 0xB3 && b[0xB2] === 0x96)){
      return { core:"gba", label:"GAME BOY ADVANCE", ext:".gba" };
    }
    if(file.size > 4 * 1024 * 1024){
      return { core:"gba", label:"GAME BOY ADVANCE", ext:".gba" };
    }
  } catch(e){}

  return { core:"gba", label:"GBA / ROM", ext:".gba" };
}

let currentGameKey = "default_rom";
function makeGameKey(fileName){
  return "crudogb_rom_" + fileName.toLowerCase().replace(/\.(gb|gbc|gba|rom|bin|zip)$/i, "").replace(/[^a-z0-9_-]/g, "_");
}

/* ============ CONTROLLO EMULATORE ============ */
let romLoaded = false;
let loaderInjected = false;
let sramTimer = null;

function setStatus(m){ statusEl.textContent = m || ""; }

async function startEmulator(file){
  setStatus("Caricamento...");
  const det = await detectCoreAndPlatform(file);
  currentGameKey = makeGameKey(file.name);

  const cleanBaseName = file.name.replace(/\.(gb|gbc|gba|rom|bin|zip)$/i, "");
  const normalizedName = file.name.toLowerCase().endsWith(".zip") ? file.name : (cleanBaseName + det.ext);
  const romBlob = new File([file], normalizedName, { type: "application/octet-stream" });
  const romURL = URL.createObjectURL(romBlob);

  tbName.textContent = cleanBaseName.slice(0, 22);
  tbPlat.textContent = det.label;

  window.EJS_player = "#game";
  window.EJS_core = det.core;
  window.EJS_gameUrl = romURL;
  window.EJS_pathtodata = EJS_CDN;
  window.EJS_startOnLoaded = true;
  window.EJS_gameName = cleanBaseName;
  window.EJS_threads = !!window.crossOriginIsolated;
  window.EJS_onGameStart = onGameStart;

  if(!loaderInjected){
    loaderInjected = true;
    const s = document.createElement("script");
    s.src = EJS_CDN + "loader.js";
    s.onerror = function(){
      loaderInjected = false;
      setStatus("Caricamento offline fallito. Riprova.");
    };
    document.body.appendChild(s);
  }
  setStatus("Avvio " + det.label + "...");
}

async function onGameStart(){
  romLoaded = true;
  loader.style.display = "none";
  [btnSave, btnLoad, btnFull].forEach(b => b.disabled = false);
  setStatus("");
  setTimeout(resizeCanvas, 100);

  try {
    const savedSram = await dbGet("sram", currentGameKey);
    const e = ejs();
    if(savedSram && e && e.gameManager && e.gameManager.FS){
      const savePath = e.gameManager.getSaveFilePath && e.gameManager.getSaveFilePath();
      if(savePath){
        e.gameManager.FS.writeFile(savePath, savedSram);
        e.gameManager.loadSaveFiles && e.gameManager.loadSaveFiles();
      }
    }
    const hasQuickState = await dbGet("states", currentGameKey);
    if(hasQuickState) showToast("Salvataggi caricati!");
  } catch(err){}

  clearInterval(sramTimer);
  sramTimer = setInterval(syncSramToLocal, 8000);
}

async function syncSramToLocal(){
  const e = ejs();
  if(!romLoaded || !e || !e.gameManager) return;
  try {
    if(typeof e.gameManager.getSaveFile === "function"){
      const sram = await e.gameManager.getSaveFile();
      if(sram && sram.byteLength > 0) await dbPut("sram", currentGameKey, sram);
    }
  } catch(err){}
}

romInput.addEventListener("change", (e)=>{
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  startEmulator(f);
});

/* ============ CONTROLLI INPUT MULTI-TOUCH ============ */
function ejs(){ return window.EJS_emulator || null; }
const BTN_INDEX = { b:0, select:2, start:3, up:4, down:5, left:6, right:7, a:8, l:10, r:11 };
const KEYMAP = {
  up:{key:"ArrowUp",code:"ArrowUp",keyCode:38}, down:{key:"ArrowDown",code:"ArrowDown",keyCode:40},
  left:{key:"ArrowLeft",code:"ArrowLeft",keyCode:37}, right:{key:"ArrowRight",code:"ArrowRight",keyCode:39},
  a:{key:"x",code:"KeyX",keyCode:88}, b:{key:"z",code:"KeyZ",keyCode:90},
  l:{key:"q",code:"KeyQ",keyCode:81}, r:{key:"w",code:"KeyW",keyCode:87},
  start:{key:"Enter",code:"Enter",keyCode:13}, select:{key:"Shift",code:"ShiftRight",keyCode:16,location:2}
};

const inputState = { a:false, b:false, l:false, r:false, start:false, select:false, up:false, down:false, left:false, right:false };

function dispatchKey(type,def){
  const ev=new KeyboardEvent(type,{key:def.key,code:def.code,keyCode:def.keyCode,which:def.keyCode,location:def.location||0,bubbles:true,cancelable:true});
  try{Object.defineProperty(ev,"keyCode",{get:()=>def.keyCode});}catch(e){}
  try{Object.defineProperty(ev,"which",{get:()=>def.keyCode});}catch(e){}
  document.dispatchEvent(ev);
  const cv=document.querySelector("#game canvas");
  if(cv)cv.dispatchEvent(ev);
}

function setInput(name,val){
  const isPressed = !!val;
  if(inputState[name] === isPressed) return;
  inputState[name] = isPressed;

  const e=ejs();
  if(e && e.gameManager && typeof e.gameManager.simulateInput==="function" && (name in BTN_INDEX)){
    try{ e.gameManager.simulateInput(0, BTN_INDEX[name], isPressed ? 1 : 0); return; }catch(err){}
  }
  if(KEYMAP[name]) dispatchKey(isPressed?"keydown":"keyup", KEYMAP[name]);
}

function press(name, vibrateMs){
  if(!inputState[name]) haptic(vibrateMs || 14);
  setInput(name,1);
}
function release(name){
  setInput(name,0);
}

function bindMultiTouchButton(id, name){
  const btn = document.getElementById(id);
  if(!btn) return;

  function onTouchStart(e){
    if(e && e.cancelable) e.preventDefault();
    btn.classList.add("active");
    press(name, 14);
  }
  function onTouchEnd(e){
    if(e && e.cancelable) e.preventDefault();
    if(e.targetTouches && e.targetTouches.length > 0) return;
    btn.classList.remove("active");
    release(name);
  }
  btn.addEventListener("touchstart", onTouchStart, {passive:false});
  btn.addEventListener("touchend", onTouchEnd, {passive:false});
  btn.addEventListener("touchcancel", onTouchEnd, {passive:false});
}

bindMultiTouchButton("btn-l", "l");
bindMultiTouchButton("btn-r", "r");
bindMultiTouchButton("btn-select", "select");
bindMultiTouchButton("btn-start", "start");

/* Multi-touch + slide per A e B */
(function bindABButtons(){
  const btnA = document.getElementById("btn-a");
  const btnB = document.getElementById("btn-b");
  const abZone = document.getElementById("ab-zone");
  if(!btnA || !btnB || !abZone) return;

  function checkHit(touch, el){
    const r = el.getBoundingClientRect();
    const pad = 6;
    return touch.clientX >= (r.left - pad) && touch.clientX <= (r.right + pad) &&
           touch.clientY >= (r.top - pad)  && touch.clientY <= (r.bottom + pad);
  }

  function updateABFromTouches(e){
    if(e && e.cancelable) e.preventDefault();
    let aHit = false, bHit = false;
    const touches = e.touches || [];
    for(let i=0; i<touches.length; i++){
      const t = touches[i];
      if(checkHit(t, btnA)) aHit = true;
      if(checkHit(t, btnB)) bHit = true;
    }
    if(aHit){ btnA.classList.add("active"); press("a", 14); }
    else    { btnA.classList.remove("active"); release("a"); }

    if(bHit){ btnB.classList.add("active"); press("b", 14); }
    else    { btnB.classList.remove("active"); release("b"); }
  }

  [btnA, btnB, abZone].forEach(function(el){
    el.addEventListener("touchstart", updateABFromTouches, {passive:false});
    el.addEventListener("touchmove", updateABFromTouches, {passive:false});
    el.addEventListener("touchend", updateABFromTouches, {passive:false});
    el.addEventListener("touchcancel", updateABFromTouches, {passive:false});
  });
})();

/* D-Pad con animazione frecce coordinata */
let clearDpadDirs = function(){};
(function bindDpad(){
  const dpad=document.getElementById("dpad"); if(!dpad)return;
  const glow=document.getElementById("dpad-glow");
  let activeTouchId = null;

  function updateVisuals(d){
    dpad.classList.toggle("dir-up",    !!d.up);
    dpad.classList.toggle("dir-down",  !!d.down);
    dpad.classList.toggle("dir-left",  !!d.left);
    dpad.classList.toggle("dir-right", !!d.right);

    if(!glow) return;
    let gx=0, gy=0;
    if(d.left)gx-=1; if(d.right)gx+=1; if(d.up)gy-=1; if(d.down)gy+=1;
    const len=Math.hypot(gx,gy);
    if(len>0){
      gx/=len; gy/=len;
      const R = dpad.offsetWidth * 0.27;
      glow.style.transform="translate("+(gx*R)+"px,"+(gy*R)+"px)";
    } else {
      glow.style.transform="translate(0,0)";
    }
  }

  function computeDir(cX,cY){
    const rect=dpad.getBoundingClientRect();
    const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
    const dx=cX-cx, dy=cY-cy;
    const dist=Math.hypot(dx,dy);
    const res={up:false,down:false,left:false,right:false};
    if(dist < rect.width*0.10) return res;
    let ang=Math.atan2(dy,dx)*180/Math.PI;
    if(ang<0) ang+=360;
    const sec=Math.round(ang/45)%8;
    switch(sec){
      case 0:res.right=true;break;
      case 1:res.right=true;res.down=true;break;
      case 2:res.down=true;break;
      case 3:res.down=true;res.left=true;break;
      case 4:res.left=true;break;
      case 5:res.left=true;res.up=true;break;
      case 6:res.up=true;break;
      case 7:res.up=true;res.right=true;break;
    }
    return res;
  }

  function applyDir(cX,cY){
    const d=computeDir(cX,cY);
    ["up","down","left","right"].forEach(function(k){
      if(d[k] && !inputState[k]) press(k, 8);
      if(!d[k] && inputState[k]) release(k);
    });
    updateVisuals(d);
  }

  clearDpadDirs = function(){
    activeTouchId = null;
    dpad.classList.remove("active");
    ["up","down","left","right"].forEach(function(k){ release(k); });
    updateVisuals({up:false,down:false,left:false,right:false});
  };

  dpad.addEventListener("touchstart", function(e){
    if(e && e.cancelable) e.preventDefault();
    const t = e.changedTouches[0];
    if(!t) return;
    activeTouchId = t.identifier;
    dpad.classList.add("active");
    haptic(10);
    applyDir(t.clientX, t.clientY);
  }, {passive:false});

  dpad.addEventListener("touchmove", function(e){
    if(activeTouchId === null) return;
    if(e && e.cancelable) e.preventDefault();
    for(let i=0; i<e.touches.length; i++){
      if(e.touches[i].identifier === activeTouchId){
        applyDir(e.touches[i].clientX, e.touches[i].clientY);
        break;
      }
    }
  }, {passive:false});

  function onTouchEnd(e){
    if(activeTouchId === null) return;
    if(e && e.cancelable) e.preventDefault();
    for(let i=0; i<e.changedTouches.length; i++){
      if(e.changedTouches[i].identifier === activeTouchId){
        if(e.targetTouches && e.targetTouches.length > 0){
          activeTouchId = e.targetTouches[0].identifier;
          applyDir(e.targetTouches[0].clientX, e.targetTouches[0].clientY);
        } else {
          clearDpadDirs();
        }
        break;
      }
    }
  }
  dpad.addEventListener("touchend", onTouchEnd, {passive:false});
  dpad.addEventListener("touchcancel", onTouchEnd, {passive:false});
})();

function releaseAllInputs(){
  clearDpadDirs();
  ["a","b","l","r","start","select"].forEach(function(k){ release(k); });
  document.querySelectorAll(".active").forEach(function(el){ el.classList.remove("active"); });
}
window.addEventListener("blur", releaseAllInputs);
document.addEventListener("visibilitychange", function(){ if(document.hidden){ releaseAllInputs(); syncSramToLocal(); } });

/* ============ OPERAZIONI SALVATAGGIO / CARICAMENTO ============ */
btnSave.addEventListener("click", async function(){
  haptic(14);
  const e = ejs();
  if(!e || !e.gameManager) return;
  try {
    const st = await e.gameManager.getState();
    await dbPut("states", currentGameKey, st);
    await syncSramToLocal();
    showToast("Partita Salvata ✓");
    closeMenu();
  } catch(err){
    showToast("Errore Salvataggio!");
  }
});

btnLoad.addEventListener("click", async function(){
  haptic(14);
  const e = ejs();
  if(!e || !e.gameManager) return;
  try {
    let savedBytes = await dbGet("states", currentGameKey);
    if(!savedBytes){
      showToast("Nessun salvataggio trovato");
      return;
    }
    await e.gameManager.loadState(savedBytes);
    showToast("Partita Caricata ✓");
    closeMenu();
  } catch(err){
    showToast("Errore Caricamento!");
  }
});

btnFull.addEventListener("click", function(){
  haptic(14);
  const wrap = document.getElementById("phone-screen");
  const req = wrap.requestFullscreen || wrap.webkitRequestFullscreen || wrap.webkitEnterFullscreen;
  if(document.fullscreenElement){ (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
  else if(req){ req.call(wrap); }
  closeMenu();
});

function resizeCanvas(){
  const cv = document.querySelector("#game canvas");
  if(!cv) return;
  cv.style.width = "100%";
  cv.style.height = "100%";
  cv.style.imageRendering = "pixelated";
}
window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange", function(){
  releaseAllInputs();
  setTimeout(resizeCanvas, 150);
});
document.addEventListener("fullscreenchange", resizeCanvas);

  if(romLoaded && !e.target.closest(".menu-panel") && e.cancelable) e.preventDefault();
}, {passive:false});
